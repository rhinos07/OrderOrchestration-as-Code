# Order-type-level file. Short and stable - references everything else.
# Part of a channel (see ../../channel.yaml). This file validates against
# schemas/order-type.schema.json
#
# Covers the ASN (Avisierung: an announced, not-yet-arrived shipment)
# AND the putaway sub-orders spawned from it once goods receipt is
# confirmed - both share this one order_type/status machine, the same
# way a b2c_standard sub-order shares its parent's order_type. See
# strategies/split_rules.yaml for why that's an imperfect fit.

order_type:
  id: "inbound_advice"
  name: "Inbound Advice (ASN) / Putaway"

  imports:
    - "structure/fields.yaml"
    - "structure/status.yaml"
    - "strategies/split_rules.yaml"
    - "strategies/workflow_triggers.yaml"
    - "strategies/completion_rules.yaml"
