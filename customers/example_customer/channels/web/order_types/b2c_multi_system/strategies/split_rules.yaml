# When/how an order of this type is decomposed into sub-orders. This file
# validates against schemas/split-rule.schema.json (per entry)

split_rules:
  # Multi-system outbound scenario (see
  # examples/multi_system_reallocation_walkthrough/): the shuttle-served
  # zone can only move goods as far as a consolidation area, never all the
  # way to the order's real target - a target_gap, closed reactively by
  # completion_rules.yaml's REALLOCATE_SHUTTLE_TARGET_GAP, not planned
  # upfront here.

  - id: "SPLIT_TO_SHUTTLE_ZONE"
    condition: "storage_technology_split"
    split_by: "storage_technology"
    when:
      dimension_value: "shuttle"
    target_override:
      type: "activity_area"
      id: "CONSOLIDATION_1"

  - id: "SPLIT_TO_MANUAL_PICK_ZONE"
    condition: "storage_technology_split"
    split_by: "storage_technology"
    when:
      dimension_value: "manual_pick"
    # No target_override: the manual pick zone can reach the outbound
    # door directly.
