# Which downstream workflow starts for each split outcome. This file
# validates against schemas/workflow-trigger.schema.json (per entry)

workflow_triggers:
  - id: "TRIGGER_SHUTTLE_PICK"
    split_rule: "SPLIT_TO_SHUTTLE_ZONE"
    trigger: "pick_task"

  - id: "TRIGGER_MANUAL_PICK_ZONE"
    split_rule: "SPLIT_TO_MANUAL_PICK_ZONE"
    trigger: "pick_task"
