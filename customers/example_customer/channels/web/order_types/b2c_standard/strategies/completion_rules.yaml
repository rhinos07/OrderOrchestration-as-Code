# What happens when sub-order(s) reach a given status. This file
# validates against schemas/completion-rule.schema.json (per entry)

completion_rules:
  # Neither sub-order alone satisfies the original order - the AutoStore
  # sub-order only ever reaches its cell's own EXIT, never the real
  # outbound door. Once BOTH sub-orders have reached their own target
  # ("completed"), spawn a new consolidation order targeting the
  # original door. Its positions would be suborder_output_request
  # entries referencing SPLIT_TO_AUTOSTORE's and
  # SPLIT_TO_MANUAL_WAREHOUSE's resulting sub-orders (assigned by the
  # runtime when it spawns the order - not declared here).
  - id: "CONSOLIDATE_AFTER_BOTH_SUBORDERS"
    when:
      status: "completed"
      quantifier: "all_children"
      # Scopes this rule to exactly the two split_rules it's meant to
      # watch - defense in depth now that b2c_standard only has these two
      # rules, but keeps the rule correct if a third split_rule is ever
      # added to this order_type. See schemas/completion-rule.schema.json.
      source_split_rules: ["SPLIT_TO_AUTOSTORE", "SPLIT_TO_MANUAL_WAREHOUSE"]
    action:
      type: "spawn_order"
      spawn_order_type: "b2c_standard"
      spawn_target:
        type: "door"
        id: "DOOR_02"
      # b2c_standard-001 itself is never fulfilled - the consolidation
      # order this spawns is what actually reaches DOOR_02. Without this,
      # the parent stayed at "created" forever. See structure/status.yaml.
      supersedes_parent: true

  # REALLOCATE_SHUTTLE_TARGET_GAP moved to b2c_multi_system's own
  # completion_rules.yaml - see split_rules.yaml's comment above for why.
