# What happens when sub-order(s) reach a given status. This file
# validates against schemas/completion-rule.schema.json (per entry)

completion_rules:
  # Neither sub-order alone satisfies the original order - the AutoStore
  # sub-order only ever reaches its cell's own EXIT, never the real
  # outbound door. Once BOTH sub-orders have reached their own target
  # ("completed"), spawn a new consolidation order targeting the
  # original door. Its positions would be suborder_output_request
  # entries referencing SPLIT_TO_AUTOSTORE's and
  # SPLIT_TO_MANUAL_WAREHOUSE's resulting sub-orders (assigned by the
  # runtime when it spawns the order - not declared here).
  - id: "CONSOLIDATE_AFTER_BOTH_SUBORDERS"
    when:
      status: "completed"
      quantifier: "all_children"
    action:
      type: "spawn_order"
      spawn_order_type: "b2c_standard"
      spawn_target:
        type: "door"
        id: "DOOR_02"

  # Reactive re-split for the multi-system scenario (see
  # examples/multi_system_reallocation_walkthrough/): a shuttle-served
  # sub-order confirms its quantity but only reaches an intermediate
  # consolidation area, not the order's real order_target. Fires as soon
  # as THAT ONE child is detected (any_child + target_gap), not batched
  # with siblings the way CONSOLIDATE_AFTER_BOTH_SUBORDERS is - the new
  # sub-order inherits order_target unchanged; which system/route
  # actually moves it the rest of the way is a runtime allocation
  # decision, not declared here.
  - id: "REALLOCATE_SHUTTLE_TARGET_GAP"
    when:
      status: "completed"
      quantifier: "any_child"
      target_gap: true
    action:
      type: "reallocate_remainder"
      reallocate_order_type: "b2c_standard"
