# Status state machine for this order type. Every order and sub-order of
# this type has its own independent position in this state machine - a
# sub-order reaching "completed" does not by itself complete its parent,
# see strategies/completion_rules.yaml. This file validates against
# schemas/status.schema.json

statuses:
  - id: "created"
  - id: "allocated"
  - id: "in_fulfillment"
  - id: "completed"
    terminal: true
  - id: "cancelled"
    terminal: true
  # Reached only via a completion_rule whose action.supersedes_parent is
  # true (see strategies/completion_rules.yaml's CONSOLIDATE_AFTER_BOTH_SUBORDERS)
  # - the order isn't fulfilled itself, it's replaced by the order that
  # rule spawns. Distinct from "completed" on purpose.
  - id: "superseded"
    terminal: true

transitions:
  - from: "created"
    to: "allocated"
  - from: "allocated"
    to: "in_fulfillment"
  - from: "in_fulfillment"
    to: "completed"
  - from: "created"
    to: "cancelled"
  - from: "allocated"
    to: "cancelled"
  - from: "in_fulfillment"
    to: "cancelled"
  # b2c_standard-style top-level orders never advance past "created"
  # before their completion_rule fires - see supersedes_parent above.
  - from: "created"
    to: "superseded"
