# This file validates against schemas/status.schema.json

statuses:
  - id: "created"
  - id: "in_fulfillment"
  - id: "completed"
    terminal: true
  - id: "cancelled"
    terminal: true

transitions:
  - from: "created"
    to: "in_fulfillment"
  - from: "in_fulfillment"
    to: "completed"
  - from: "created"
    to: "cancelled"
  - from: "in_fulfillment"
    to: "cancelled"
