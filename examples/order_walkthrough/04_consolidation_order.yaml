# CONSOLIDATE_AFTER_BOTH_SUBORDERS fires once BOTH ORD-1001-A and
# ORD-1001-B are "completed" (all_children), spawning this order:
# target = the original order's real target (DOOR_02), positions =
# suborder_output_request entries referencing the two completed
# sub-orders rather than fresh material_requests. It also carries
# action.supersedes_parent: true, which moves ORD-1001 to the reserved
# terminal "superseded" status - see this example's README "A gap this
# example surfaced" for the full write-up, including why this order
# being ALSO a child of ORD-1001 (parent_order_id below) does not, on
# its own, make CONSOLIDATE_AFTER_BOTH_SUBORDERS re-fire.

order:
  order_id: "ORD-1001-C"
  order_type: "b2c_standard"
  parent_order_id: "ORD-1001"
  target: { type: "door", id: "DOOR_02" }
  order_target: { type: "door", id: "DOOR_02" }
  status: "completed"

positions:
  - line_id: "C1"
    suborder_output_request:
      source_order_id: "ORD-1001-A"

  - line_id: "C2"
    suborder_output_request:
      source_order_id: "ORD-1001-B"
