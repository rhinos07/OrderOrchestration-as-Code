# Reusable catalog of reasons an order can be split into sub-orders.
# Referenced by strategies/split_rules.yaml -> split_rule.condition.

split_reasons:
  - id: "storage_technology_split"
    description: "Different parts of the order are fulfilled by different storage technologies/areas within the same facility (e.g. AutoStore vs. manual warehouse) and must be picked as separate sub-orders."

  - id: "multi_location_availability"
    description: "Ordered items are only jointly available across multiple facilities/DCs."

  - id: "partial_availability"
    description: "Some ordered quantity is available now, the rest only later (backorder split)."

  - id: "carrier_limit"
    description: "Order exceeds a single carrier's capacity/constraints and must ship in multiple shipments."

  - id: "promise_date_grouping"
    description: "Order lines have different promised delivery dates and are split to ship independently."

  - id: "target_gap"
    description: "A sub-order's executing system confirmed its requested quantity but could only physically move it to an intermediate point (e.g. a consolidation area), not the order's actual order_target - the gap between the sub-order's target and its order_target must be closed by a further sub-order (see completion_rule.when.target_gap / action.reallocate_remainder)."

  - id: "quantity_shortfall"
    description: "A sub-order's executing system confirmed less quantity than requested - the shortfall must be reallocated to another system via a new sub-order (see completion_rule.action.reallocate_remainder)."

  - id: "execution_failure"
    description: "A sub-order's executing system failed to execute it (e.g. equipment fault, exception) - its full requested quantity must be reallocated to another system via a new sub-order (see completion_rule.action.reallocate_remainder)."

  - id: "putaway_destination_split"
    description: "A confirmed inbound receipt is distributed across multiple storage destinations/technologies (e.g. AutoStore vs. manual high-bay) and must be put away as separate sub-orders. Inbound counterpart of storage_technology_split - see customers/example_customer/channels/inbound/order_types/inbound_advice/strategies/split_rules.yaml for why this direction doesn't fit split_rule.target_override cleanly."
